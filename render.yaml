# Render Blueprint: New → Blueprint → pick this repo.
services:
  - type: web
    name: ultimate-scraper
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Chromium needs ~1 GB per browser; "standard" (2 GB) is the smallest plan that is comfortable.
    plan: standard
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: API_KEY
        generateValue: true
      - key: MAX_CONCURRENT_JOBS
        value: "2"
      - key: MAX_BROWSER_CONCURRENCY
        value: "2"
      - key: SYNC_TIMEOUT_SECS
        value: "120"
      - key: JOB_TTL_MINUTES
        value: "60"
      # Comma-separated proxy URLs (http://user:pass@host:port). Residential ones are needed for Google, Instagram and Facebook.
      # Tier 0 (preferred/cheapest provider).
      - key: PROXY_URLS
        sync: false
      # Tier 1 (fallback provider) -- optional. Set together with PROXY_URLS for an
      # automatic cascade (Crawlee escalates to this tier only when tier 0 is failing).
      - key: PROXY_URLS_TIER2
        sync: false
      # Any OpenAI-compatible API (Gemini, DeepSeek, Qwen, Groq, OpenRouter, OpenAI, Ollama…). See README.
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_API_KEY
        sync: false
